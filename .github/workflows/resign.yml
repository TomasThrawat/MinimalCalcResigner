name: Resign APK

on:
  workflow_dispatch:

jobs:
  resign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble split base APK
        run: |
          cat apks/com.devstacktools.bigcalc.apk.part* > apks/com.devstacktools.bigcalc.apk
          rm apks/com.devstacktools.bigcalc.apk.part*

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download apktool
        run: |
          curl -sL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar

      - name: Patch base APK (strip Pairip license/integrity check, rename package + app name)
        run: |
          java -jar apktool.jar d apks/com.devstacktools.bigcalc.apk -o decoded_base -f

          OLD_PKG="com.devstacktools.bigcalc"
          NEW_PKG="com.write.calc"
          OLD_SLASH="com/devstacktools/bigcalc"
          NEW_SLASH="com/write/calc"

          grep -rl "$OLD_SLASH\|$OLD_PKG" decoded_base --include="*.smali" --include="*.xml" | while read -r f; do
            sed -i "s#$OLD_SLASH#$NEW_SLASH#g; s#$OLD_PKG#$NEW_PKG#g" "$f"
          done

          mkdir -p decoded_base/smali/com/write
          mv decoded_base/smali/com/devstacktools/bigcalc decoded_base/smali/com/write/calc
          rmdir decoded_base/smali/com/devstacktools 2>/dev/null || true

          python3 - <<'PYEOF'
import re
p = "decoded_base/AndroidManifest.xml"
c = open(p, encoding="utf-8").read()
c = re.sub(r'<activity android:exported="false" android:name="com\.pairip\.licensecheck\.LicenseActivity"/>\s*', '', c)
c = re.sub(r'<provider android:authorities="com\.write\.calc\.com\.pairip\.licensecheck\.LicenseContentProvider" android:exported="false" android:name="com\.pairip\.licensecheck\.LicenseContentProvider"/>\s*', '', c)
c = re.sub(r'<uses-permission android:name="com\.android\.vending\.CHECK_LICENSE"/>\s*', '', c)
open(p, "w", encoding="utf-8").write(c)
PYEOF

          rm -rf decoded_base/smali/com/pairip

          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">calc</string>#' decoded_base/res/values/strings.xml
          sed -i 's#<string name="app_label_drawer">[^<]*</string>#<string name="app_label_drawer">calc</string>#' decoded_base/res/values/strings.xml

          java -jar apktool.jar b decoded_base -o apks/com.devstacktools.bigcalc.apk

      - name: Patch config splits (rename package)
        run: |
          for split in arm64_v8a en zh; do
            java -jar apktool.jar d "apks/config.${split}.apk" -o "decoded_${split}" -f
            sed -i 's#com\.devstacktools\.bigcalc#com.write.calc#g' "decoded_${split}/AndroidManifest.xml"
            java -jar apktool.jar b "decoded_${split}" -o "apks/config.${split}.apk"
          done

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools
        run: sdkmanager --install "build-tools;34.0.0"

      - name: Generate new signing key
        run: |
          keytool -genkeypair -v \
            -keystore run.jks -alias runkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=Build ${{ github.run_id }}, OU=CI, O=CI, L=City, S=State, C=EG"

      - name: Zipalign and sign splits
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          mkdir -p signed
          for f in apks/*.apk; do
            name=$(basename "$f" .apk)
            "$BT/zipalign" -v -p 4 "$f" "signed/${name}.apk"
            "$BT/apksigner" sign --ks run.jks --ks-key-alias runkey \
              --ks-pass pass:android123 --key-pass pass:android123 \
              "signed/${name}.apk"
            "$BT/apksigner" verify "signed/${name}.apk"
          done

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: signed-apks-${{ github.run_id }}
          path: signed/*.apk
